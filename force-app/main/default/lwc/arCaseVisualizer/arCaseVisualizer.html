<template>
  <lightning-card title="AR Case Visualizer">
    <div class="slds-p-around_medium">
      <lightning-input
        label="Enter Case Number"
        value={caseNumber}
        onchange={handleCaseNumberChange}
      ></lightning-input>
      <lightning-button
        label="Launch AR Interaction"
        onclick={launchARInteraction}
        class="slds-m-top_medium"
      ></lightning-button>
    </div>

    <template if:true={showARInteraction}>
      <div class="slds-p-around_medium">
        <h2 class="slds-text-heading_medium">AR Interaction Zone</h2>
        <img src={arDemoImageUrl} alt="AR Demo" class="demo-image" />
        <p class="slds-m-top_small">This is your AR simulation zone.</p>
      </div>
    </template>
  </lightning-card>
</template>
