<template>
  <lightning-card title="Smart Guidance Panel">
    <div class="slds-p-around_medium">
      <lightning-input
        label="Enter Case Number"
        value={caseNumber}
        onchange={handleCaseNumberChange}
      ></lightning-input>
      <lightning-button
        label="Fetch Guidance"
        onclick={fetchGuidance}
        class="slds-m-top_small"
      ></lightning-button>
    </div>

    <template if:true={guidance}>
      <div class="slds-p-around_medium">
        <template for:each={guidance} for:item="item">
          <p key={item}>• {item}</p>
        </template>
      </div>
    </template>

    <template if:true={error}>
      <div class="slds-text-color_error slds-p-around_medium">{error}</div>
    </template>
  </lightning-card>
</template>
